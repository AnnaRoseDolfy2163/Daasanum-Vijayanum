<!DOCTYPE html>
<html lang="ml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="google" content="notranslate">

  <title>എടാ വിജയാ..</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Chilanka&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: linear-gradient(180deg,
          #3b6cb7 0%,
          #7ba3d9 25%,
          #c3d9f2 55%,
          #eef4fb 80%,
          #ffffff 100%);
      background-attachment: fixed;
      color: #1e2a3a;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }


    /* =========================
   BACKGROUND GLOW
========================= */

    body::before {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.7), transparent 70%);
      top: -150px;
      right: -150px;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.5), transparent 70%);
      bottom: -150px;
      left: -150px;
      z-index: -2;
    }

    /* =========================
   HERO
========================= */

    .hero {

      min-height: 100vh;

      padding:
        60px 6% 80px;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    .hero-content {
      width: 100%;
      max-width: 1250px;
      display: grid;
      grid-template-columns: 1fr .9fr;
      gap: 40px;
      align-items: center;
    }


    /* =========================
   LEFT TITLE
========================= */

    .intro {

      position: relative;
    }

    .kicker {

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 4px;

      color: #4a3826;

      margin-bottom: 25px;
    }


    .title {

      font-family: "Chilanka", cursive;

      font-size:
        clamp(65px,
          9vw,
          140px);

      line-height: .72;

      font-weight: 400;

      letter-spacing: -5px;

      transform: rotate(-2deg);

      color: #ffffff;

      text-shadow: 0 2px 12px rgba(30, 58, 138, 0.35);
    }


    .title span {

      display: block;

      margin-left: 60px;

      margin-top: 25px;

      color: #ffffff;

      text-shadow: 0 2px 12px rgba(30, 58, 138, 0.35);
    }


    .sub {

      margin-top: 55px;

      max-width: 360px;

      color: #3d2e20;

      font-size: 14px;

      line-height: 1.8;
    }


    /* =========================
   CLOUDS
========================= */

    .cloud {
      position: fixed;
      background: #ffffff;
      border-radius: 100px;
      opacity: 0.85;
      z-index: -1;
      animation: drift 40s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: #ffffff;
      border-radius: 100px;
    }

    .cloud-1 {
      width: 160px;
      height: 50px;
      top: 8%;
      left: -200px;
      animation-duration: 55s;
    }

    .cloud-1::before {
      width: 80px;
      height: 80px;
      top: -35px;
      left: 20px;
    }

    .cloud-1::after {
      width: 60px;
      height: 60px;
      top: -25px;
      left: 90px;
    }

    .cloud-2 {
      width: 120px;
      height: 40px;
      top: 18%;
      left: -160px;
      animation-duration: 70s;
      animation-delay: -20s;
    }

    .cloud-2::before {
      width: 60px;
      height: 60px;
      top: -25px;
      left: 15px;
    }

    .cloud-2::after {
      width: 45px;
      height: 45px;
      top: -18px;
      left: 65px;
    }

    .cloud-3 {
      width: 100px;
      height: 35px;
      top: 5%;
      left: -140px;
      animation-duration: 48s;
      animation-delay: -10s;
      opacity: 0.6;
    }

    .cloud-3::before {
      width: 50px;
      height: 50px;
      top: -20px;
      left: 12px;
    }

    .cloud-3::after {
      width: 38px;
      height: 38px;
      top: -14px;
      left: 55px;
    }

    @keyframes drift {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(140vw);
      }
    }


    /* =========================
   SMALL CHAT PREVIEW + CTA
========================= */

    .mini-chat {

      width: 100%;

      max-width: 300px;

      margin: auto;

      background: rgba(255, 255, 255, 0.9);

      border-radius: 24px;

      padding: 28px 24px;

      text-align: center;

      box-shadow: 0 20px 50px rgba(30, 58, 138, 0.2);

      transform: rotate(1deg);

      transition: .4s;
    }

    .mini-chat:hover {
      transform: rotate(0deg) translateY(-6px);
    }

    .mini-chat-icon {

      width: 56px;
      height: 56px;

      margin: 0 auto 12px;

      border-radius: 50%;

      background: #2563eb;

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Chilanka", cursive;

      font-size: 24px;
    }

    .mini-chat-name {

      font-weight: 600;

      font-size: 15px;

      color: #1e3a8a;

      margin-bottom: 4px;
    }

    .mini-online {

      font-size: 10px;

      font-weight: 400;

      color: #64748b;
    }

    .mini-chat-hint {

      font-family: "Chilanka", cursive;

      font-size: 16px;

      color: #64748b;

      margin: 14px 0 20px;
    }

    .cta-button {

      width: 100%;

      padding: 14px 20px;

      border: none;

      border-radius: 30px;

      background: #2563eb;

      color: #ffffff;

      font-family: "DM Sans", sans-serif;

      font-size: 14px;

      font-weight: 600;

      letter-spacing: .5px;

      cursor: pointer;

      transition: .3s;
    }

    .cta-button:hover {
      background: #1e3a8a;
      transform: scale(1.03);
    }


    /* =========================
   WHIMSY SECTION
========================= */

    .whimsy {

      min-height: 100vh;

      padding: 150px 8%;

      background: #f5eddf;

      position: relative;

      overflow: hidden;

      display: flex;

      align-items: center;
    }


    .whimsy-content {

      max-width: 1100px;

      margin: auto;

      width: 100%;

      text-align: center;
    }


    .whimsy-small {

      font-size: 10px;

      letter-spacing: 4px;

      color: #4a3826;

      margin-bottom: 30px;
    }


    .whimsy-title {

      font-family: "Chilanka", cursive;

      font-size:
        clamp(60px,
          9vw,
          140px);

      line-height: .75;

      font-weight: 400;
    }


    .whimsy-title span {

      color: #9c513d;

      display: block;

      margin-top: 30px;
    }


    /* FLOATING WORDS */

    .float {

      position: absolute;

      font-family: "Chilanka", cursive;

      font-size: 25px;

      opacity: .5;

      animation: float 5s ease-in-out infinite;
    }

    .one {
      left: 8%;
      top: 20%;
    }

    .two {
      right: 10%;
      top: 30%;

      animation-delay: 1s;
    }

    .three {
      left: 18%;
      bottom: 18%;

      animation-delay: 2s;
    }

    .four {
      right: 15%;
      bottom: 12%;

      animation-delay: 3s;
    }


    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(-4deg);
      }

      50% {
        transform: translateY(-18px) rotate(4deg);
      }
    }


    /* =========================
   STORY
========================= */

    .story {

      background: #1d211d;

      color: #f4eadb;

      padding: 150px 8%;
    }


    .story-container {

      max-width: 1000px;

      margin: auto;

      display: grid;

      grid-template-columns: .3fr 1fr;

      gap: 80px;

    }


    .story-label {

      font-size: 10px;

      letter-spacing: 4px;

      color: #a7b0a4;
    }


    .story h2 {

      font-family: "Chilanka", cursive;

      font-size:
        clamp(55px,
          7vw,
          100px);

      font-weight: 400;

      line-height: .8;

      margin-bottom: 40px;
    }


    .story p {

      max-width: 650px;

      color: #c4c6bc;

      font-size: 15px;

      line-height: 1.9;
    }


    /* =========================
   FOOTER
========================= */

    footer {

      background: #1d211d;

      color: #aaa;

      border-top: 1px solid #343933;

      padding: 30px 6%;

      display: flex;

      justify-content: space-between;

      font-size: 9px;

      letter-spacing: 2px;
    }



    /* =========================
           BLENDED HERO IMAGE
        ========================= */

    .hero {
      position: relative;
      overflow: hidden;
    }

    /* The photo sits on the right and dissolves into the sky — no visible image box. */
    .hero-image {
      position: absolute;
      z-index: 0;
      right: -2%;
      top: 3%;
      width: 58%;
      height: 94%;
      pointer-events: none;

      background-image: url("WhatsApp Image 2026-09-12 at 8.35.46 PM (1).jpeg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;

      /* Softly disappear into the blue background on every edge. */
      -webkit-mask-image: linear-gradient(to right,
          transparent 0%,
          rgba(0, 0, 0, .35) 10%,
          black 27%,
          black 86%,
          transparent 100%),
        linear-gradient(to bottom,
          transparent 0%,
          black 8%,
          black 88%,
          transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to right,
          transparent 0%,
          rgba(0, 0, 0, .35) 10%,
          black 27%,
          black 86%,
          transparent 100%),
        linear-gradient(to bottom,
          transparent 0%,
          black 8%,
          black 88%,
          transparent 100%);
      mask-composite: intersect;

      opacity: .93;
      filter: saturate(.9) contrast(.95);
    }

    /* Extra blue veil at the left edge makes the photo feel part of the page. */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(90deg,
          rgba(59, 108, 183, .10) 0%,
          rgba(59, 108, 183, 0) 35%,
          rgba(59, 108, 183, .04) 78%,
          rgba(59, 108, 183, .14) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .intro {
      position: relative;
      z-index: 3;
    }

    .mini-chat {
      position: relative;
      z-index: 3;
      margin-right: 8%;
      background: rgba(255, 255, 255, .90);
      backdrop-filter: blur(7px);
    }

    /* =========================
   MOBILE
========================= */

    @media(max-width:850px) {

      nav {
        padding: 18px 6%;
      }

      .menu {
        display: none;
      }

      .hero {
        padding: 60px 6% 80px;
      }

      .hero-content {
        grid-template-columns: 1fr;
        gap: 55px;
      }

      .title {
        font-size: 20vw;
      }

      .title span {
        margin-left: 30px;
      }


      .hero-image {
        width: 105%;
        height: 62%;
        right: -30%;
        top: 4%;
        opacity: .32;
        background-position: center center;
      }

      .mini-chat {
        margin-right: auto;
      }

      .mini-chat {
        transform: none;
      }

    }
  </style>
</head>


<body>

  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <!-- =========================
     HERO
========================= -->

  <section class="hero" id="chat">

    <div class="hero-image" aria-hidden="true"></div>

    <div class="hero-content">


      <!-- INTRO -->

      <div class="intro">

        <span
          style="position:absolute; top:-30px; left:-10px; font-size:34px; color:#3b6cb7; animation: float 4s ease-in-out infinite;">✦</span>
        <span
          style="position:absolute; top:40px; right:10px; font-size:28px; color:#7ba3d9; animation: float 5s ease-in-out infinite 1s;">✧</span>
        <span
          style="position:absolute; bottom:-20px; left:40%; font-size:30px; color:#1e3a8a; animation: float 4.5s ease-in-out infinite 2s;">✦</span>

        <h1 class="title notranslate" translate="no">

          എടാ വിജയാ..

          <span class="notranslate" translate="no">
            എന്താടാ ദാസാ....
          </span>

        </h1>

      </div>



      <!-- SMALL CHAT PREVIEW + CTA -->

      <div class="mini-chat">

        <div class="mini-chat-icon notranslate" translate="no">
          വി
        </div>

        <div class="mini-chat-name notranslate" translate="no">
          വിജയൻ <span class="mini-online" translate="yes">● online</span>
        </div>

        <button id="startChat" class="cta-button">
          ➤ Go to Chatbot
        </button>

      </div>

    </div>

  </section>

  <audio id="startSound" src="/sounds/enthada-vijaya.mp3"></audio>

  <script>
    document.getElementById('startChat').addEventListener('click', function () {
      var sound = document.getElementById('startSound');
      sound.play().catch(function () { });
      setTimeout(function () {
        window.location.href = 'chat.html';
      }, 600);
    });
  </script>


</body>

</html>
