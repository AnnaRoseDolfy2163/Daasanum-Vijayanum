<!DOCTYPE html>
<html lang="ml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="google" content="notranslate">

  <title>എടാ വിജയാ.. എന്താടാ ദാസാ....</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Chilanka&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    /* =========================
       RESET
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       BODY
    ========================== */

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 35px;

      font-family: "DM Sans", sans-serif;
      color: #1e2a3a;

      background: linear-gradient(180deg,
          #3b6cb7 0%,
          #7ba3d9 25%,
          #c3d9f2 55%,
          #eef4fb 80%,
          #ffffff 100%);

      background-attachment: fixed;
      overflow: hidden;
    }


    /* =========================
       BACKGROUND GLOW
    ========================== */

    body::before {
      content: "";

      position: fixed;

      width: 600px;
      height: 600px;

      border-radius: 50%;

      background:
        radial-gradient(circle,
          rgba(255, 255, 255, 0.7),
          transparent 70%);

      top: -150px;
      right: -150px;

      z-index: -1;
    }


    body::after {
      content: "";

      position: fixed;

      width: 500px;
      height: 500px;

      border-radius: 50%;

      background:
        radial-gradient(circle,
          rgba(255, 255, 255, 0.5),
          transparent 70%);

      bottom: -150px;
      left: -150px;

      z-index: -1;
    }


    /* =========================
       MAIN CHAT WINDOW
    ========================== */

    .chat-window {
      width: min(900px, 100%);
      height: min(720px, 88vh);

      display: flex;
      flex-direction: column;

      background: rgba(255, 255, 255, 0.94);

      border-radius: 32px;
      overflow: hidden;

      border: 1px solid rgba(255, 255, 255, 0.8);

      box-shadow:
        0 30px 80px rgba(30, 58, 138, 0.22),
        0 8px 25px rgba(30, 58, 138, 0.08);
    }


    /* =========================
       HEADER
    ========================== */

    header {
      padding: 25px 30px;

      background: #1e3a8a;
      color: #ffffff;
    }


    .header-title {
      font-family: "Chilanka", cursive;

      font-size: 30px;
      font-weight: 400;

      line-height: 1;
    }


    /* =========================
       CHAT AREA
    ========================== */

    #chatBox {
      flex: 1;

      overflow-y: auto;

      padding: 32px;

      background:
        linear-gradient(180deg,
          rgba(238, 244, 251, 0.8),
          rgba(255, 255, 255, 0.96));
    }


    /* =========================
       SCROLLBAR
    ========================== */

    #chatBox::-webkit-scrollbar {
      width: 5px;
    }

    #chatBox::-webkit-scrollbar-track {
      background: transparent;
    }

    #chatBox::-webkit-scrollbar-thumb {
      background: #7ba3d9;
      border-radius: 10px;
    }


    /* =========================
       MESSAGE
    ========================== */

    .message {
      display: flex;

      width: 100%;

      margin-bottom: 18px;

      animation: messageIn 0.35s ease;
    }


    .message.dasan {
      justify-content: flex-end;
    }


    .message.vijayan {
      justify-content: flex-start;
    }


    /* =========================
       MESSAGE BUBBLE
    ========================== */

    .bubble {
      max-width: 72%;

      padding: 14px 18px;

      font-family: "Chilanka", cursive;

      font-size: 19px;
      line-height: 1.55;

      box-shadow:
        0 7px 20px rgba(30, 58, 138, 0.07);
    }


    /* DASAN */

    .message.dasan .bubble {
      background: #f5d27d;

      color: #3d2e20;

      border-radius:
        20px 20px 5px 20px;
    }


    /* VIJAYAN */

    .message.vijayan .bubble {
      background: #c3d9f2;

      color: #1e3a8a;

      border-radius:
        20px 20px 20px 5px;
    }


    /* =========================
       TIME
    ========================== */

    .time {
      display: block;

      margin-top: 5px;

      font-family: "DM Sans", sans-serif;

      font-size: 8px;

      opacity: 0.5;

      text-align: right;

      letter-spacing: 0.5px;
    }


    /* =========================
       LOADING
    ========================== */

    .loading {
      display: flex;

      justify-content: flex-start;

      margin-bottom: 18px;
    }


    .loading-bubble {
      background: #c3d9f2;

      color: #1e3a8a;

      padding: 13px 18px;

      border-radius:
        20px 20px 20px 5px;

      font-family: "Chilanka", cursive;

      font-size: 17px;

      animation:
        breathing 1.5s ease-in-out infinite;
    }


    /* =========================
       INPUT AREA
    ========================== */

    #inputBar {
      display: flex;

      gap: 10px;

      padding: 18px 24px;

      background: #f5eddf;

      border-top:
        1px solid rgba(30, 58, 138, 0.08);
    }


    /* =========================
       INPUT
    ========================== */

    #userInput {
      flex: 1;

      height: 50px;

      padding: 0 18px;

      border:
        1px solid rgba(30, 58, 138, 0.12);

      border-radius: 15px;

      outline: none;

      background: #ffffff;

      color: #1e2a3a;

      font-family: "Chilanka", cursive;

      font-size: 19px;

      transition: 0.25s;
    }


    #userInput:focus {
      border-color: #7ba3d9;

      box-shadow:
        0 0 0 3px rgba(123, 163, 217, 0.15);
    }


    #userInput::placeholder {
      color: #94a3b8;

      font-family: "Chilanka", cursive;
    }


    /* =========================
       SEND BUTTON
    ========================== */

    #sendBtn {
      height: 50px;

      padding: 0 25px;

      border: none;

      border-radius: 15px;

      background: #2563eb;

      color: #ffffff;

      font-family: "DM Sans", sans-serif;

      font-size: 13px;

      font-weight: 600;

      letter-spacing: 0.5px;

      cursor: pointer;

      transition: 0.3s;
    }


    #sendBtn:hover {
      background: #1e3a8a;

      transform: translateY(-2px);

      box-shadow:
        0 8px 20px rgba(30, 58, 138, 0.22);
    }


    #sendBtn:active {
      transform: translateY(0);
    }


    /* =========================
       RESET BUTTON
    ========================== */

    #resetBtn {
      height: 50px;

      padding: 0 18px;

      border: 1px solid rgba(30, 58, 138, 0.18);

      border-radius: 15px;

      background: transparent;

      color: #1e3a8a;

      font-family: "DM Sans", sans-serif;

      font-size: 12px;

      font-weight: 600;

      letter-spacing: 0.5px;

      cursor: pointer;

      transition: 0.3s;
    }


    #resetBtn:hover {
      background: rgba(30, 58, 138, 0.08);
    }


    /* =========================
       ANIMATIONS
    ========================== */

    @keyframes messageIn {

      from {
        opacity: 0;

        transform:
          translateY(10px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }


    @keyframes breathing {

      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 650px) {

      body {
        padding: 15px;

        overflow: auto;
      }


      .chat-window {
        width: 100%;

        height: 92vh;

        border-radius: 24px;
      }


      header {
        padding: 21px 22px;
      }


      .header-title {
        font-size: 26px;
      }


      #chatBox {
        padding: 24px 18px;
      }


      .bubble {
        max-width: 84%;

        font-size: 18px;
      }


      #inputBar {
        padding: 14px;
      }


      #userInput {
        min-width: 0;

        font-size: 17px;
      }


      #sendBtn {
        padding: 0 18px;
      }

    }
  </style>

</head>


<body>


  <!-- =========================
       CHAT WINDOW
  ========================== -->

  <main class="chat-window">


    <!-- HEADER -->

    <header>

      <div class="header-title notranslate" translate="no">
        ദാസനും വിജയനും
      </div>

    </header>


    <!-- =========================
         CHAT MESSAGES
    ========================== -->

    <div id="chatBox">


      <!-- FIRST VIJAYAN MESSAGE -->

      <div class="message vijayan">

        <div class="bubble notranslate" translate="no">

          എടാ ദാസാ... എന്തുണ്ട് വിശേഷം?

          <span class="time">
            10:45 PM
          </span>

        </div>

      </div>


    </div>


    <!-- =========================
         INPUT
    ========================== -->

    <form id="inputBar">

      <input id="userInput" type="text" autocomplete="off" placeholder="എന്തെങ്കിലും പറയെടാ...">

      <button id="sendBtn" type="submit">
        Send
      </button>

      <button id="resetBtn" type="button" title="Start a fresh conversation">
        Reset
      </button>

    </form>


  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const chatBox =
      document.getElementById("chatBox");

    const input =
      document.getElementById("userInput");

    const form =
      document.getElementById("inputBar");


    /*
     * Conversation history
     */

    let history = [];


    /* =========================
       ADD MESSAGE
    ========================== */

    function addMessage(text, sender) {

      const message =
        document.createElement("div");

      message.className =
        `message ${sender}`;


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble notranslate";

      bubble.setAttribute(
        "translate",
        "no"
      );


      /*
       * Using textContent prevents
       * unwanted HTML inside messages.
       */

      bubble.textContent = text;


      /*
       * Add time
       */

      const time =
        document.createElement("span");

      time.className =
        "time";


      const now =
        new Date();


      time.textContent =
        now.toLocaleTimeString(
          [],
          {
            hour: "numeric",
            minute: "2-digit"
          }
        );


      bubble.appendChild(time);

      message.appendChild(bubble);

      chatBox.appendChild(message);


      /*
       * Scroll to latest message
       */

      chatBox.scrollTop =
        chatBox.scrollHeight;

    }


    /* =========================
       SEND MESSAGE
    ========================== */

    form.addEventListener(
      "submit",
      async function (e) {

        e.preventDefault();


        const text =
          input.value.trim();


        /*
         * Don't send empty messages
         */

        if (!text) return;


        /*
         * Show user's message
         */

        addMessage(
          text,
          "dasan"
        );


        /*
         * Save to history
         */

        history.push({

          role: "user",

          content: text

        });


        /*
         * Clear input
         */

        input.value = "";


        /*
         * Disable button
         */

        const sendButton =
          document.getElementById(
            "sendBtn"
          );

        sendButton.disabled = true;


        /*
         * Loading message
         */

        const loading =
          document.createElement("div");

        loading.className =
          "loading";


        const loadingBubble =
          document.createElement("div");

        loadingBubble.className =
          "loading-bubble";

        loadingBubble.textContent =
          "വിജയൻ ആലോചിക്കുന്നു...";


        loading.appendChild(
          loadingBubble
        );


        chatBox.appendChild(
          loading
        );


        chatBox.scrollTop =
          chatBox.scrollHeight;


        try {

          /*
           * Send request to backend
           */

          const response =
            await fetch(
              "/chat",
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    history:
                      history
                  })

              }
            );


          /*
           * Check server response
           */

          if (!response.ok) {

            throw new Error(
              "Server error"
            );

          }


          const data =
            await response.json();


          /*
           * Remove loading
           */

          loading.remove();


          /*
           * Get AI reply
           */

          const reply =
            data.reply ||
            data.message ||
            "എടാ... എന്തോ പ്രശ്നമുണ്ട്.";


          /*
           * Show Vijay's reply
           */

          addMessage(
            reply,
            "vijayan"
          );


          /*
           * Save AI response
           */

          history.push({

            role: "assistant",

            content: reply

          });

        }


        catch (error) {

          /*
           * Remove loading
           */

          loading.remove();


          /*
           * Error message
           */

          addMessage(
            "എടാ... connection-ന് എന്തോ പ്രശ്നമുണ്ട്. ഒന്ന് കൂടി നോക്കെടാ.",
            "vijayan"
          );

        }


        finally {

          /*
           * Enable button again
           */

          sendButton.disabled = false;

          input.focus();

        }

      }
    );


    /* =========================
       ENTER TO SEND
    ========================== */

    input.addEventListener(
      "keydown",
      function (e) {

        if (
          e.key === "Enter" &&
          !e.shiftKey
        ) {

          e.preventDefault();

          form.requestSubmit();

        }

      }
    );


    /*
     * Automatically focus input
     */

    input.focus();


    /* =========================
       RESET CONVERSATION
    ========================== */

    const resetBtn =
      document.getElementById("resetBtn");

    resetBtn.addEventListener(
      "click",
      function () {

        /*
         * Clear conversation history sent to the backend
         */

        history = [];


        /*
         * Clear the chat window
         */

        chatBox.innerHTML = "";


        /*
         * Re-add the opening Vijayan message,
         * matching the page's initial state
         */

        const message =
          document.createElement("div");

        message.className =
          "message vijayan";

        const bubble =
          document.createElement("div");

        bubble.className =
          "bubble notranslate";

        bubble.setAttribute(
          "translate",
          "no"
        );

        bubble.textContent =
          "എടാ ദാസാ... എന്തുണ്ട് വിശേഷം?";

        const time =
          document.createElement("span");

        time.className = "time";

        const now = new Date();

        time.textContent =
          now.toLocaleTimeString(
            [],
            { hour: "numeric", minute: "2-digit" }
          );

        bubble.appendChild(time);
        message.appendChild(bubble);
        chatBox.appendChild(message);


        input.value = "";
        input.focus();

      }
    );

  </script>

</body>

</html>
